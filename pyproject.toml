[project]
name = "rag-document-qa"
version = "0.1.0"
description = "RAG Document Q&A — an investigation of retrieval-augmented generation, built stage by stage."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=8.0.0",
    "ruff>=0.17.6",
]

[project.scripts]
rag = "rag.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF's SWIG bindings warn on import; not actionable here.
# Starlette's TestClient asks for httpx2 (a new dependency, not added); httpx still works.
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# The learning track is a historical record, not maintained code.
extend-exclude = ["experiments/learning"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors/warnings, import order, bugbear (likely bugs), pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are inside prompt strings: wrapping them would change the text sent to the model
# (answer_smoke.py asserts its copy equals the shipped prompt).
"src/rag/answer/prompt.py" = ["E501"]
"experiments/stage1/answer_smoke.py" = ["E501"]
"src/rag/generation/context_builder.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]
