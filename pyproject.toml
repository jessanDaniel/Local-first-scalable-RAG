[project]
name = "rag-document-qa"
version = "0.1.0"
description = "RAG Document Q&A — an investigation of retrieval-augmented generation, built stage by stage."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=8.0.0",
    "ruff>=0.17.6",
]

[project.scripts]
rag = "rag.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF's SWIG bindings warn on import; not actionable here.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The learning track is a historical record, not maintained code.
extend-exclude = ["experiments/learning"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors/warnings, import order, bugbear (likely bugs), pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]
